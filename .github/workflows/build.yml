name: Build Frostium.exe
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install PyQt6 PyQt6-WebEngine pyinstaller
      - run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name Frostium --icon assets/icon.ico --add-data "assets;assets" frostium.py
      - uses: actions/upload-artifact@v4
        with:
          name: Frostium-Windows
          path: dist/Frostium.exe
